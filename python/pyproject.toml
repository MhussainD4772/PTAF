[project]
name = "ptaf"
version = "0.1.0"
description = "PTAF Python test automation framework"
requires-python = ">=3.11"
dependencies = [
    "playwright",
    "pytest",
    "pytest-bdd",
    "pytest-xdist",
    "pyyaml",
    "pytest-html",
    "psycopg[binary]",
    "pyodbc",
    "python-dotenv",
    "jsonpath-ng>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ptaf"]
