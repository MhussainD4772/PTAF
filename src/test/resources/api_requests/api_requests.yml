# ==========================================================
# Reusable API Request Definitions
#
# Each entry defines a logical name for a request, the HTTP method,
# and the endpoint path.
#
# Use {placeholder} syntax for dynamic parts of the URL,
# which will be replaced by path parameters in the tests.
# ==========================================================

# --- JSONPlaceholder Example Requests ---
jsonplaceholder_requests:
  get_all_posts:
    method: "GET"
    endpoint: "/posts"
  get_single_post:
    method: "GET"
    endpoint: "/posts/{postId}"
  create_post:
    method: "POST"
    endpoint: "/posts"
  update_post:
    method: "PUT"
    endpoint: "/posts/{postId}"
  delete_post:
    method: "DELETE"
    endpoint: "/posts/{postId}"

# --- Internal CRM Example Requests ---
crm_requests:
  get_user_profile:
    method: "GET"
    endpoint: "/users/{userId}/profile"
  create_new_lead:
    method: "POST"
    endpoint: "/leads"