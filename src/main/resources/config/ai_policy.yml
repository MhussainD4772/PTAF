# Phase 4 — governance defaults (non-secret). Override via same keys in ai_assistant if merged later.
ai_policy:
  # Block generation if requirement matches any of these regexes (Java Pattern syntax)
  blocked_requirement_patterns: []
  # Max characters for requirement text (0 = no limit)
  max_requirement_chars: 20000
  # Quality gate: flag step text repeated at least this many times (project-wide)
  duplicate_step_warn_threshold: 8
  # Quality gate: fail in --strict if any duplicate group exceeds this
  duplicate_step_fail_threshold: 25
  # Before sending logs to triage Gemini call, redact API-key-like strings
  redact_triage_input: true
