[project]
name = "ptaf"
version = "0.1.0"
description = "PTAF Python test automation framework"
requires-python = ">=3.11"
dependencies = [
    "playwright",
    "pytest",
    "pytest-bdd",
    "pytest-xdist",
    "pyyaml",
    "pytest-html",
    "psycopg[binary]",
    "pyodbc",
    "python-dotenv",
    "jsonpath-ng>=1.8.0",
    "click>=8.4.1",
    "mcp>=1.28.0",
]

[project.scripts]
ptaf-ai = "ptaf.ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/main/ptaf"]
