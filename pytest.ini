[pytest]
pythonpath = src/main src/test
testpaths = src/test
python_files = test_*.py *_steps.py scenario_bindings.py
addopts =
    --html=reports/report.html
    --self-contained-html
markers =
    ui: UI / browser tests (Java @ui or non-api/db scenarios)
    api: API tests (Java @api)
    db: Database tests (Java @db)
    regression: Regression suite (Java @regression)
    smoke: Smoke tests (Java @smoke)
    last_scenario_feature: Reuse browser stack across scenarios (Java @LastScenario)
    LastScenario: Gherkin @LastScenario — reuse browser across scenarios in a feature
    Panda_Page: automation_panda.feature
    google: google.feature
    FrameTesting: frameTesting.feature
    secondPageTest: secondPageTest.feature
    login_page: feature.feature login scenarios
