[pytest]
testpaths = tests steps
python_files = test_*.py *_steps.py scenario_bindings.py
addopts =
    --html=reports/report.html
    --self-contained-html
markers =
    ui: UI / browser tests (Java @ui or non-api/db scenarios)
    api: API tests (Java @api)
    db: Database tests (Java @db)
    regression: Regression suite (Java @regression)
    smoke: Smoke tests (Java @smoke)
    last_scenario_feature: Reuse browser stack across scenarios (Java @LastScenario)
    Panda_Page: automation_panda.feature
    google: google.feature
    FrameTesting: frameTesting.feature
    secondPageTest: secondPageTest.feature
    login_page: feature.feature login scenarios
    personal_bank: personaBank_Checking.feature
    personal_bank_business: personaBank_Saving.feature
    personal_bank_test: personal_bank.feature and personal_bank_2.feature
    regression_365_test: estore_Regression.feature suite tag
    regression_351: estore regression scenario tag
    regression_352: estore regression scenario tag
    regression_282: estore regression scenario tag
    regression_508: estore regression scenario tag
    regression_363: estore regression scenario tag
    regression_367: estore regression scenario tag
    estyle: personaBank_Checking estyle scenario
    estylePlus: personaBank_Checking estylePlus scenario
    freeStyle: personaBank_Checking freeStyle scenario
    lifeStyle: personaBank_Checking lifeStyle scenario
    premiumStyle: personaBank_Checking premiumStyle scenario
    FirstRate: personaBank_Saving FirstRate scenario
    FirstRateMoney: personaBank_Saving FirstRateMoney scenario
    HealthSavingsAccount: personaBank_Saving HSA scenario
    CertificateDeposit: personaBank_Saving CD scenario
    SaversGoalCertDip: personaBank_Saving savers goal CD scenario
    CertiDepositSpecial: personaBank_Saving CD special scenario
    FlexCD: personaBank_Saving FlexCD scenario
